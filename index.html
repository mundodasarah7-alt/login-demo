<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
<title>Instagram</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fafafa;
      font-family: Arial, Helvetica, sans-serif;
      color: #262626;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 350px;
      padding: 20px;
    }

    .login-box {
      background: white;
      border: 1px solid #dbdbdb;
      padding: 38px 38px 28px;
      text-align: center;
    }

.logo {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 40px;
  font-weight: 600;
  text-align: center;
  letter-spacing: -1.5px;
  margin-bottom: 24px;
}
    .demo-label {
      font-size: 12px;
      color: #777;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      height: 42px;
      margin-bottom: 8px;
      padding: 10px;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
      background: #fafafa;
      font-size: 13px;
      outline: none;
    }

    button {
      width: 100%;
      height: 38px;
      margin-top: 8px;
      border: none;
      border-radius: 6px;
      background: #4f8cff;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .forgot {
      display: block;
      margin-top: 20px;
      font-size: 12px;
      color: #385185;
      text-decoration: none;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      background: #f0f7ff;
      color: #245;
      font-size: 13px;
      line-height: 1.4;
    }

    .signup {
      margin-top: 10px;
      padding: 22px;
      background: white;
      border: 1px solid #dbdbdb;
      text-align: center;
      font-size: 14px;
    }

    .signup span {
      color: #4f8cff;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: #888;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">Instagram</div><section class="login-box">

<title>Instagram</title>
      <div class="demo-label">
Sign up to see photos and videos from your friends.      </div>

      <form onsubmit="mostrarDemo(event)">

        <input
          type="text"
          placeholder="E-mail ou nome de usuário"
          autocomplete="off"
        >

        <input
          type="password"
          placeholder="Senha"
          autocomplete="off"
        >

        <button type="submit">
          Entrar
        </button>

      </form>

      <a href="#" class="forgot" onclick="return false;">
        Esqueceu a senha?
      </a>

      <div id="message" class="message">
        Esta é uma demonstração educativa.
        Os dados digitados não são enviados nem armazenados.
      </div>

    </section>

    <section class="signup">
      Não tem uma conta? <span>Cadastre-se</span>
    </section>

    <div class="footer">
    </div>

  </main>

  <script>
    function mostrarDemo(event) {
      event.preventDefault();
      document.getElementById("message").style.display = "block";
    }
  </script>

</body>
</html>
